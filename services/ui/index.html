<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZIA — Zero-Day Investigation Agent</title>
  <meta name="description" content="Production-style agentic zero-day investigation pipeline. Ingest, deduplicate, enrich, and score CVE alerts with live AI reasoning streams." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    .font-mono, pre, code { font-family: 'JetBrains Mono', monospace !important; }

    /* Animated gradient orbs */
    @keyframes orb-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.97); }
    }
    .orb { animation: orb-float 12s ease-in-out infinite; }
    .orb-2 { animation: orb-float 16s ease-in-out infinite reverse; }

    /* Glowing pulse for live indicator */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34,211,238,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(34,211,238,0); }
    }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

    /* Timeline connector */
    @keyframes timeline-appear {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .timeline-item { animation: timeline-appear 0.3s ease-out both; }

    /* Shimmer for loading rows */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, rgba(30,41,59,0) 0%, rgba(148,163,184,0.06) 50%, rgba(30,41,59,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,0.7); }

    /* Table row hover */
    .alert-row { transition: background 0.15s ease; cursor: pointer; }
    .alert-row:hover { background: rgba(34,211,238,0.05); }

    /* Status badge transition */
    .badge { transition: all 0.2s ease; }

    /* Card hover lift */
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #67e8f9 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body class="min-h-screen bg-[#030712] text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, memo, useRef } = React;

    // ─── Example Payloads ─────────────────────────────────────────────────────
    const EXAMPLES = [
      {
        id: "log4shell",
        label: "CISA Advisory — Log4Shell (CVE-2021-44228)",
        source: "cisa-advisory",
        title: "Critical: Active exploitation of Log4Shell in customer edge",
        format: "json",
        rawInput: `{
  "tenant_id": "demo-tenant",
  "title": "Critical alert: active exploitation in customer edge",
  "source": "cisa-advisory",
  "details": {
    "cve": "CVE-2021-44228",
    "product": "Apache Log4j",
    "version": "2.14.1",
    "src_ip": "203.0.113.45",
    "dst_domain": "api.corp.example.com",
    "note": "CISA confirms active exploitation in the wild. Immediate action required."
  },
  "actors": ["APT29"]
}`
      },
      {
        id: "http2-rapid-reset",
        label: "Vendor Blog — HTTP/2 Rapid Reset (CVE-2023-44487)",
        source: "vendor-blog",
        title: "HTTP/2 Rapid Reset attack via CVE-2023-44487 in internet-facing services",
        format: "text",
        rawInput: `Vendor advisory: An attacker is exploiting CVE-2023-44487 in internet-facing HTTP/2 services.
Observed impact includes rapid request flooding against gateway.example.com and exposed reverse proxies.
Patch any HTTP/2 stack using version 1.3.2 or older. The activity has been linked to a public proof-of-concept on GitHub.`
      },
      {
        id: "eternalblue",
        label: "Markdown Bulletin — EternalBlue (CVE-2017-0144)",
        source: "security-blog",
        title: "EternalBlue detected in legacy SMB environments — ATT&CK mapping required",
        format: "markdown",
        rawInput: `## Zero-day bulletin

- CVE-2017-0144 detected in legacy SMB environments
- IP 198.51.100.80 repeatedly touched the perimeter
- Domain benign.example.org was used in a staged test
- Product: Legacy SMB on patched hosts

Recommended: isolate affected assets, hunt for lateral movement, and validate patch coverage.`
      }
    ];

    // ─── Pipeline labels per PRD ──────────────────────────────────────────────
    const PIPELINE_STAGES = ["RECEIVED","NORMALIZED","DEDUP_CHECK","ENRICHING","SCORING","COMPLETED"];

    function statusLabel(status) {
      if (!status) return "UNKNOWN";
      const map = {
        "RECEIVED": "IN_PROGRESS",
        "NORMALIZED": "NORMALIZED",
        "DEDUP_CHECK": "DEDUP_CHECK",
        "ENRICHING": "ENRICHING",
        "SCORING": "SCORING",
        "COMPLETED": "COMPLETED",
        "DUPLICATE": "DUPLICATE",
        "FAILED": "FAILED",
      };
      return map[status] || status;
    }

    function statusTone(status) {
      const s = statusLabel(status);
      if (s === "COMPLETED")  return "bg-emerald-500/15 text-emerald-300 border-emerald-500/30";
      if (s === "DUPLICATE")  return "bg-amber-500/15  text-amber-300  border-amber-500/30";
      if (s === "IN_PROGRESS" || s === "ENRICHING" || s === "SCORING" || s === "NORMALIZED" || s === "DEDUP_CHECK")
                              return "bg-cyan-500/15   text-cyan-300   border-cyan-500/30";
      if (s === "FAILED")     return "bg-rose-500/15   text-rose-300   border-rose-500/30";
      return "bg-slate-500/15 text-slate-300 border-slate-500/30";
    }

    function severityTone(band) {
      if (!band) return "text-slate-400";
      const b = band.toLowerCase();
      if (b === "critical") return "text-rose-300";
      if (b === "high")     return "text-orange-300";
      if (b === "medium")   return "text-yellow-300";
      return "text-slate-400";
    }

    function prettyDate(value) {
      if (!value) return "—";
      try { return new Date(value).toLocaleString(); } catch { return String(value); }
    }

    function relativeTime(value) {
      if (!value) return "—";
      const diff = Date.now() - new Date(value).getTime();
      if (diff < 60000)   return `${Math.round(diff/1000)}s ago`;
      if (diff < 3600000) return `${Math.round(diff/60000)}m ago`;
      return `${Math.round(diff/3600000)}h ago`;
    }

    function safeJsonParse(value) {
      try { return JSON.parse(value); } catch { return null; }
    }

    // ─── Shared Components ────────────────────────────────────────────────────
    function Badge({ status }) {
      return (
        <span className={`badge inline-flex items-center rounded-full border px-2.5 py-0.5 text-[11px] font-semibold tracking-widest ${statusTone(status)}`}>
          {statusLabel(status)}
        </span>
      );
    }

    function MetricCard({ label, value, hint, accent }) {
      return (
        <div className="card-hover rounded-2xl border border-slate-800/80 bg-gradient-to-br from-slate-900/90 to-slate-900/40 p-5 shadow-lg">
          <div className="text-[10px] font-semibold uppercase tracking-[0.22em] text-slate-500">{label}</div>
          <div className={`mt-2 text-2xl font-semibold ${accent || "text-slate-50"}`}>{value}</div>
          {hint && <div className="mt-1.5 text-xs text-slate-500">{hint}</div>}
        </div>
      );
    }

    function NavBar({ path, navigate }) {
      const isActive = (p) => path === p || (p === "/" && path === "/");
      return (
        <nav className="sticky top-0 z-50 border-b border-slate-800/60 bg-[#030712]/90 backdrop-blur-xl">
          <div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
            <button
              onClick={() => navigate("/")}
              className="flex items-center gap-3 group"
              id="nav-logo"
            >
              <div className="relative">
                <div className="h-8 w-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 group-hover:shadow-cyan-500/50 transition-shadow">
                  <span className="text-[13px] font-bold text-slate-950">Z</span>
                </div>
                <div className="absolute -top-0.5 -right-0.5 h-2 w-2 rounded-full bg-emerald-400 pulse-glow"></div>
              </div>
              <div className="flex flex-col leading-none">
                <span className="text-sm font-semibold text-slate-100">ZIA</span>
                <span className="text-[10px] text-slate-500">Zero-Day Investigation Agent</span>
              </div>
            </button>

            <div className="flex items-center gap-1">
              {[
                { href: "/", label: "Dashboard", id: "nav-dashboard" },
                { href: "/submit", label: "Submit Alert", id: "nav-submit" },
              ].map(({ href, label, id }) => (
                <button
                  key={href}
                  id={id}
                  onClick={() => navigate(href)}
                  className={`rounded-full px-4 py-1.5 text-sm font-medium transition-all ${
                    isActive(href)
                      ? "bg-cyan-500/15 text-cyan-300 border border-cyan-500/30"
                      : "text-slate-400 hover:text-slate-100 hover:bg-slate-800/60"
                  }`}
                >
                  {label}
                </button>
              ))}
            </div>
          </div>
        </nav>
      );
    }

    // ─── Ambient Background ────────────────────────────────────────────────────
    function AmbientBg() {
      return (
        <div className="pointer-events-none fixed inset-0 overflow-hidden">
          <div className="orb absolute -top-40 -right-40 h-96 w-96 rounded-full bg-cyan-600/8 blur-3xl" />
          <div className="orb-2 absolute top-1/3 -left-32 h-80 w-80 rounded-full bg-blue-600/8 blur-3xl" />
          <div className="orb absolute bottom-0 right-1/4 h-64 w-64 rounded-full bg-indigo-600/6 blur-3xl" />
        </div>
      );
    }

    // ─── Alerts Dashboard (FR-15) ─────────────────────────────────────────────
    function AlertsDashboard({ navigate }) {
      const [alerts, setAlerts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [statusFilter, setStatusFilter] = useState("ALL");
      const [severityFilter, setSeverityFilter] = useState("ALL");
      const [lastRefresh, setLastRefresh] = useState(null);
      const intervalRef = useRef(null);

      const fetchAlerts = useCallback(async () => {
        try {
          const params = new URLSearchParams();
          if (statusFilter !== "ALL") params.set("status", statusFilter);
          if (severityFilter !== "ALL") params.set("severity", severityFilter);
          const resp = await fetch(`/api/v1/alerts?${params}`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          setAlerts(data);
          setLastRefresh(new Date());
          setError("");
        } catch (err) {
          setError(err.message || "Failed to load alerts");
        } finally {
          setLoading(false);
        }
      }, [statusFilter, severityFilter]);

      useEffect(() => {
        setLoading(true);
        fetchAlerts();
        // Auto-refresh every 5 seconds.
        intervalRef.current = setInterval(fetchAlerts, 5000);
        return () => clearInterval(intervalRef.current);
      }, [fetchAlerts]);

      const statusCounts = useMemo(() => {
        const counts = {};
        for (const a of alerts) {
          const lbl = statusLabel(a.status);
          counts[lbl] = (counts[lbl] || 0) + 1;
        }
        return counts;
      }, [alerts]);

      const STATUS_OPTIONS = ["ALL", "RECEIVED", "ENRICHING", "SCORING", "COMPLETED", "DUPLICATE", "FAILED"];
      const SEVERITY_OPTIONS = ["ALL", "CRITICAL", "HIGH", "MEDIUM", "LOW"];

      return (
        <div className="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
          {/* Header */}
          <div className="mb-8">
            <div className="text-xs font-semibold uppercase tracking-[0.24em] text-cyan-400">Live Operations</div>
            <h1 className="mt-2 text-3xl font-semibold text-slate-50">Alert Dashboard</h1>
            <p className="mt-2 text-sm text-slate-400 max-w-2xl">
              All ingested zero-day alerts, auto-refreshing every 5 seconds. Click any row to view the live investigation timeline.
            </p>
          </div>

          {/* Metric cards */}
          <div className="mb-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <MetricCard
              label="Total alerts"
              value={String(alerts.length)}
              hint="All time, across all tenants"
            />
            <MetricCard
              label="Completed"
              value={String(statusCounts["COMPLETED"] || 0)}
              hint="Fully enriched and scored"
              accent="text-emerald-300"
            />
            <MetricCard
              label="In progress"
              value={String((statusCounts["IN_PROGRESS"] || 0) + (statusCounts["ENRICHING"] || 0) + (statusCounts["SCORING"] || 0))}
              hint="Actively being investigated"
              accent="text-cyan-300"
            />
            <MetricCard
              label="Duplicates"
              value={String(statusCounts["DUPLICATE"] || 0)}
              hint="Linked to canonical case"
              accent="text-amber-300"
            />
          </div>

          {/* Filters */}
          <div className="mb-4 flex flex-wrap items-center gap-3">
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-500 uppercase tracking-widest">Status</span>
              <div className="flex gap-1 flex-wrap">
                {STATUS_OPTIONS.map((s) => (
                  <button
                    key={s}
                    id={`filter-status-${s.toLowerCase()}`}
                    onClick={() => setStatusFilter(s)}
                    className={`rounded-full border px-3 py-1 text-xs font-medium transition-all ${
                      statusFilter === s
                        ? "border-cyan-500/50 bg-cyan-500/15 text-cyan-300"
                        : "border-slate-700 text-slate-400 hover:border-slate-600 hover:text-slate-200"
                    }`}
                  >
                    {s}
                  </button>
                ))}
              </div>
            </div>
            <div className="ml-auto flex items-center gap-2">
              <span className="text-xs text-slate-500 uppercase tracking-widest">Severity</span>
              <select
                value={severityFilter}
                onChange={(e) => setSeverityFilter(e.target.value)}
                id="filter-severity"
                className="rounded-xl border border-slate-700 bg-slate-900 px-3 py-1.5 text-xs text-slate-100 outline-none focus:border-cyan-500/50"
              >
                {SEVERITY_OPTIONS.map((s) => <option key={s}>{s}</option>)}
              </select>
              <button
                onClick={fetchAlerts}
                id="btn-refresh"
                className="rounded-xl border border-slate-700 bg-slate-900/60 px-3 py-1.5 text-xs text-slate-300 hover:border-cyan-500/40 hover:text-cyan-200 transition-all"
              >
                ↻ Refresh
              </button>
              {lastRefresh && (
                <span className="text-[10px] text-slate-600">
                  Updated {relativeTime(lastRefresh)}
                </span>
              )}
            </div>
          </div>

          {/* Alerts table */}
          <div className="rounded-2xl border border-slate-800/80 bg-slate-900/40 overflow-hidden shadow-2xl">
            {error && (
              <div className="p-4 text-sm text-rose-300 bg-rose-500/10 border-b border-rose-500/20">{error}</div>
            )}

            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-slate-800/80">
                    <th className="px-4 py-3 text-left text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">Alert ID</th>
                    <th className="px-4 py-3 text-left text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">Received</th>
                    <th className="px-4 py-3 text-left text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">Title / Source</th>
                    <th className="px-4 py-3 text-left text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">Top CVE</th>
                    <th className="px-4 py-3 text-left text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">Status</th>
                    <th className="px-4 py-3 text-left text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">CPS</th>
                    <th className="px-4 py-3 text-left text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-500">Severity</th>
                  </tr>
                </thead>
                <tbody>
                  {loading && (
                    Array.from({ length: 5 }).map((_, i) => (
                      <tr key={i} className="border-b border-slate-800/40">
                        {Array.from({ length: 7 }).map((_, j) => (
                          <td key={j} className="px-4 py-4">
                            <div className="shimmer h-3 rounded-full bg-slate-800/80" style={{ width: `${40 + j * 10}%` }} />
                          </td>
                        ))}
                      </tr>
                    ))
                  )}
                  {!loading && alerts.length === 0 && (
                    <tr>
                      <td colSpan={7} className="px-4 py-16 text-center text-slate-500">
                        <div className="text-2xl mb-2">🛡️</div>
                        No alerts yet. <button onClick={() => navigate("/submit")} className="text-cyan-400 hover:text-cyan-300 underline">Submit one</button> to get started.
                      </td>
                    </tr>
                  )}
                  {!loading && alerts.map((alert) => (
                    <tr
                      key={alert.alert_id}
                      className="alert-row border-b border-slate-800/40 last:border-0"
                      onClick={() => navigate(`/alerts/${alert.alert_id}`)}
                      id={`alert-row-${alert.alert_id}`}
                    >
                      <td className="px-4 py-3.5">
                        <span className="font-mono text-[11px] text-slate-400">{(alert.alert_id || "").slice(0, 8)}…</span>
                      </td>
                      <td className="px-4 py-3.5 whitespace-nowrap">
                        <span className="text-xs text-slate-400">{relativeTime(alert.created_at)}</span>
                      </td>
                      <td className="px-4 py-3.5 max-w-xs">
                        <div className="font-medium text-slate-200 truncate">{alert.title || "—"}</div>
                        <div className="text-[11px] text-slate-500 mt-0.5">{alert.source || ""}</div>
                      </td>
                      <td className="px-4 py-3.5">
                        <span className="font-mono text-[11px] text-cyan-300">{alert.top_cve || "—"}</span>
                      </td>
                      <td className="px-4 py-3.5">
                        <Badge status={alert.status} />
                      </td>
                      <td className="px-4 py-3.5">
                        {alert.composite_priority_score != null ? (
                          <span className={`font-semibold text-sm ${severityTone(alert.severity_band)}`}>
                            {Number(alert.composite_priority_score).toFixed(1)}
                          </span>
                        ) : (
                          <span className="text-slate-600 text-xs">—</span>
                        )}
                      </td>
                      <td className="px-4 py-3.5">
                        <span className={`text-xs font-semibold ${severityTone(alert.severity_band)}`}>
                          {alert.severity_band || "—"}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* CTA */}
          <div className="mt-6 flex justify-end">
            <button
              id="btn-submit-alert"
              onClick={() => navigate("/submit")}
              className="rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 hover:from-cyan-400 hover:to-blue-500 transition-all"
            >
              + Submit New Alert
            </button>
          </div>
        </div>
      );
    }

    // ─── Timeline Item ────────────────────────────────────────────────────────
    const TimelineItem = memo(function TimelineItem({ item, latencyMs, index }) {
      const [open, setOpen] = useState(false);
      const hasMeta = item.metadata && Object.keys(item.metadata).length > 0;

      const icon =
        item.event_type.includes("pre_tool_use")          ? "🔧"
        : item.event_type.includes("tool_skipped")        ? "🌀"
        : item.event_type.includes("executive_subagent")  ? "🧠"
        : item.event_type.includes("agent_start")         ? "🚀"
        : item.event_type.includes("status_change")       ? "📊"
        : "•";

      const isStatusChange = item.event_type === "status_change";

      return (
        <div className="timeline-item relative pl-7 pb-5">
          <div className={`absolute left-0 top-1.5 h-3 w-3 rounded-full ${isStatusChange ? "bg-indigo-400 shadow-[0_0_14px_rgba(129,140,248,0.7)]" : "bg-cyan-400 shadow-[0_0_14px_rgba(34,211,238,0.6)]"}`} />
          <div className="absolute left-[5px] top-4 h-full w-px bg-gradient-to-b from-slate-700 to-transparent" />
          <div className="rounded-xl border border-slate-800/80 bg-slate-950/70 p-4 backdrop-blur-sm">
            <div className="flex items-start justify-between gap-3">
              <div className="flex items-center gap-2 font-medium text-slate-100">
                <span className="text-base">{icon}</span>
                <span className="text-sm">{item.event_type}</span>
              </div>
              <div className="flex flex-wrap items-center justify-end gap-1.5">
                <span className="rounded-full border border-slate-700/60 bg-slate-900/60 px-2 py-0.5 text-[10px] text-slate-400">step {item.step_index}</span>
                {latencyMs !== null && latencyMs > 0 && (
                  <span className="rounded-full border border-emerald-500/25 bg-emerald-500/10 px-2 py-0.5 text-[10px] text-emerald-300">+{latencyMs}ms</span>
                )}
              </div>
            </div>
            <p className="mt-2 text-sm leading-6 text-slate-300">{item.message || "(no message)"}</p>
            <p className="mt-1 text-[10px] text-slate-600">{prettyDate(item.timestamp)}</p>
            {hasMeta && (
              <div className="mt-3">
                <button
                  onClick={() => setOpen(v => !v)}
                  className="rounded-full border border-slate-700/60 bg-slate-900/60 px-3 py-1 text-[10px] text-slate-300 hover:border-cyan-500/30 hover:text-cyan-200 transition-all"
                >
                  {open ? "▲ Hide metadata" : "▼ Show metadata"}
                </button>
                {open && (
                  <pre className="mt-2 max-h-56 overflow-auto rounded-xl border border-slate-800/60 bg-[#050d1a] p-3 text-[10px] leading-5 text-cyan-100 font-mono">
                    {JSON.stringify(item.metadata, null, 2)}

    // ─── Alert Detail Page ────────────────────────────────────────────────────
    function AlertDetailPage({ alertId, navigate }) {
      const [detail, setDetail] = useState(null);
      const [events, setEvents] = useState([]);
      const [streamStatus, setStreamStatus] = useState("Connecting…");
      const [error, setError] = useState("");
      const [streamDone, setStreamDone] = useState(false);

      useEffect(() => {
        let cancelled = false;
        fetch(`/api/v1/alerts/${alertId}`)
          .then(r => r.json().then(b => ({ ok: r.ok, body: b })))
          .then(({ ok, body }) => {
            if (cancelled) return;
            if (!ok) throw new Error(body.detail || "Failed to load alert detail");
            setDetail(body);
            setEvents(body.timeline || []);
            setStreamStatus(statusLabel(body.alert?.status));
          })
          .catch(err => { if (!cancelled) setError(err.message); });
        return () => { cancelled = true; };
      }, [alertId]);

      useEffect(() => {
        const source = new EventSource(`/api/v1/alerts/${alertId}/stream`);
        source.onopen = () => { setStreamStatus("IN_PROGRESS"); setError(""); };
        source.addEventListener("agent_event", (evt) => {
          try {
            const next = JSON.parse(evt.data);
            setEvents(prev => prev.some(i => i.event_id === next.event_id) ? prev : [...prev, next]);
          } catch {}
        });
        source.addEventListener("done", (evt) => {
          try {
            const data = JSON.parse(evt.data);
            setStreamStatus(statusLabel(data.status));
          } catch {}
          setStreamDone(true);
          source.close();
        });
        source.onerror = () => {
          if (!streamDone) {
            setStreamStatus("Reconnecting…");
            setError("SSE disconnected. Browser will retry automatically.");
          }
        };
        return () => source.close();
      }, [alertId]);

      const alertData = detail?.alert || {};
      const payload   = detail?.payload || {};
      const severity  = payload.severity_band || alertData.severity || "";
      const cps       = payload.composite_priority_score ?? "—";
      const summary   = payload.executive_summary || alertData.verdict || "Waiting for final summary…";
      const attackMap = payload.mitre_attack || [];
      const hypothesis      = payload.affected_asset_hypothesis || "Waiting for asset hypothesis…";
      const recommendations = payload.recommended_actions || [];
      const duplicateLink   = detail?.duplicate_link;
      const evidence        = detail?.evidence || [];
      const tokens          = detail?.token_usage || {};

      const timelineRows = useMemo(() =>
        events.map((item, index) => {
          let latencyMs = null;
          if (index > 0) {
            const prev = new Date(events[index - 1].timestamp).getTime();
            const cur  = new Date(item.timestamp).getTime();
            latencyMs = Math.max(0, cur - prev);
          }
          return { item, latencyMs };
        }), [events]);

      const visibleStatus = statusLabel(alertData.status || streamStatus);

      return (

            </div>
            <button

          {duplicateLink && (
            <div className="mb-5 rounded-xl border border-amber-500/30 bg-amber-500/10 p-4 text-sm text-amber-100">
              🔗 <strong>Duplicate detected.</strong> Linked to canonical case{" "}
              <button

          <div className="grid gap-6 xl:grid-cols-[1.2fr_0.8fr]">
            {/* Left column */}
            <div className="space-y-6">
              {/* Case snapshot */}
              <div className="rounded-2xl border border-slate-800/80 bg-gradient-to-br from-slate-900/90 to-slate-950/80 p-6 shadow-2xl">
                <div className="flex flex-wrap items-start justify-between gap-4">
                  <div className="flex-1 min-w-0">
                    <div className="text-[10px] font-semibold uppercase tracking-[0.24em] text-cyan-400">Case snapshot</div>
                    <h1 className="mt-2 text-2xl font-semibold text-slate-50 leading-snug">{alertData.title || "Investigating raw zero-day alert"}</h1>
                    <p className="mt-2 text-sm leading-6 text-slate-400">

                    </p>
                  </div>
                  <Badge status={visibleStatus} />
                </div>

                <div className="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                  <MetricCard
                    label="Composite score"
                    value={cps !== "—" ? String(Number(cps).toFixed(1)) : "—"}
                    hint={severity ? `Severity: ${severity}` : "Awaiting enrichment"}
                    accent={severityTone(severity)}
                  />
                  <MetricCard
                    label="Evidence rows"
                    value={String(evidence.length)}
                    hint="Stored in ClickHouse enrichment_evidence"
                  />
                  <MetricCard
                    label="Token cost"

                {/* Executive summary */}
                <div className="mt-6 rounded-xl border border-slate-800/60 bg-slate-900/50 p-4">
                  <div className="text-[10px] font-semibold uppercase tracking-[0.22em] text-slate-500">Executive summary</div>
                  <p className="mt-3 text-sm leading-7 text-slate-200">{summary}</p>
                </div>

                <div className="mt-4 grid gap-4 lg:grid-cols-2">
                  {/* MITRE ATT&CK */}
                  <div className="rounded-xl border border-slate-800/60 bg-slate-900/50 p-4">
                    <div className="text-[10px] font-semibold uppercase tracking-[0.22em] text-slate-500">MITRE ATT&CK mapping</div>
                    {attackMap.length === 0 ? (
                      <div className="mt-3 text-xs text-slate-500">Awaiting ATT&CK mapping…</div>
                    ) : (
                      <div className="mt-3 space-y-2.5">
                        {attackMap.slice(0, 5).map((m, i) => (

                            <div className="flex flex-wrap items-center gap-2 text-sm">
                              <span className="font-mono text-xs font-semibold text-cyan-300">{m.technique_id}</span>

                        <span className="text-xs font-semibold text-slate-200">{row.evidence_type}</span>
                        <span className="text-[10px] text-slate-600">{prettyDate(row.timestamp)}</span>
                      </div>
                      <p className="mt-1.5 text-xs text-slate-400">{row.summary}</p>

                      results: [
                        `total_tokens: ${tokens.total_tokens || 0}`,

          </div>
        </div>
      );

    // ─── Submit Alert Page ────────────────────────────────────────────────────
    function SubmitAlertPage({ navigate }) {
      const [selectedId, setSelectedId] = useState(EXAMPLES[0].id);
      const [payloadText, setPayloadText] = useState(EXAMPLES[0].rawInput);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState("");
      const [webhookSecret, setWebhookSecret] = useState(localStorage.getItem("zia_webhook_secret") || "");

      const currentExample = useMemo(() => EXAMPLES.find(e => e.id === selectedId) || EXAMPLES[0], [selectedId]);

      const onSelectExample = useCallback((id) => {
        setSelectedId(id);
        const ex = EXAMPLES.find(e => e.id === id);
        if (ex) setPayloadText(ex.rawInput);
      }, []);

      const onSubmit = useCallback(async () => {
        setSubmitting(true);
        setError("");
        try {
          const envelope = {
            tenant_id: "demo-tenant",
            title: currentExample.title,
            source: currentExample.source,
            input_format: currentExample.format,
            raw_input: payloadText,
          };
          const parsed = safeJsonParse(payloadText);
          if (parsed && typeof parsed === "object") envelope.parsed_input = parsed;

          const headers = { "Content-Type": "application/json" };
          if (webhookSecret) headers["x-Webhook-Secret"] = webhookSecret;

          const resp = await fetch("/api/v1/webhook/zeroday", {
            method: "POST",
            headers,
            body: JSON.stringify(envelope),
          });
          const body = await resp.json();
          if (!resp.ok || !body.alert_id) throw new Error(body.detail || body.error || "Webhook submission failed");
          navigate(`/alerts/${body.alert_id}`);
        } catch (err) {
          setError(err.message || "Invalid request");
        } finally {
          setSubmitting(false);
        }
      }, [currentExample, payloadText, webhookSecret, navigate]);

      return (
        <div className="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
          <div className="mb-8">
            <div className="text-[10px] font-semibold uppercase tracking-[0.24em] text-cyan-400">Alert Ingestion</div>
            <h1 className="mt-2 text-3xl font-semibold text-slate-50">Submit a Zero-Day Alert</h1>
            <p className="mt-2 text-sm text-slate-400 max-w-2xl">
              Paste raw JSON, vendor blog text, or markdown. The webhook normalizes the payload, persists the case, and hands off to the agent worker without blocking intake.
            </p>
          </div>

          <div className="grid gap-6 xl:grid-cols-[1.1fr_0.9fr]">
            {/* Left: form */}
            <div className="rounded-2xl border border-slate-800/80 bg-gradient-to-br from-slate-900/90 to-slate-950/80 p-6 shadow-2xl">
              <div className="mb-4">
                <label htmlFor="example-select" className="block text-xs text-slate-400 mb-2">Example payload</label>
                <select
                  id="example-select"
                  value={selectedId}
                  onChange={(e) => onSelectExample(e.target.value)}
                  className="w-full rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-sm text-slate-100 outline-none focus:border-cyan-500/60 transition-colors"
                >
                  {EXAMPLES.map(ex => <option key={ex.id} value={ex.id}>{ex.label}</option>)}
                </select>
                <div className="mt-2 flex flex-wrap gap-2">
                  <span className="rounded-full border border-slate-700/50 bg-slate-900/50 px-2.5 py-0.5 text-[10px] text-slate-500">{currentExample.format}</span>
                  <span className="rounded-full border border-slate-700/50 bg-slate-900/50 px-2.5 py-0.5 text-[10px] text-slate-500">source: {currentExample.source}</span>
                </div>
              </div>

              <div className="mb-4">
                <label htmlFor="raw-alert-body" className="block text-xs text-slate-400 mb-2">Raw alert body</label>
                <textarea
                  id="raw-alert-body"
                  value={payloadText}
                  onChange={(e) => setPayloadText(e.target.value)}
                  rows={14}
                  className="w-full rounded-xl border border-slate-700 bg-slate-950 p-4 font-mono text-xs leading-6 text-cyan-100 outline-none focus:border-cyan-500/60 transition-colors resize-none"
                />
              </div>

              <div className="mb-5">
                <label htmlFor="webhook-secret" className="block text-xs text-slate-400 mb-2">
                  Webhook secret
                  <span className="ml-2 text-slate-600 font-normal normal-case tracking-normal">
                    — find it in <code className="rounded bg-slate-800 px-1 py-0.5 text-[10px] text-cyan-300">.env</code> as <code className="rounded bg-slate-800 px-1 py-0.5 text-[10px] text-cyan-300">WEBHOOK_SECRET</code>
                  </span>
                </label>
                <input
                  id="webhook-secret"
                  type="password"
                  value={webhookSecret}
                  onChange={(e) => { setWebhookSecret(e.target.value); localStorage.setItem("zia_webhook_secret", e.target.value); }}
                  className="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-slate-100 outline-none focus:border-cyan-500/60 transition-colors"
                  placeholder="Paste WEBHOOK_SECRET from .env (saved to localStorage)"
                />
                <p className="mt-1.5 text-[10px] text-slate-600">Saved in your browser's localStorage — only needs to be entered once per device.</p>
              </div>

              {error && <div className="mb-4 rounded-xl border border-rose-500/30 bg-rose-500/10 p-4 text-sm text-rose-300">{error}</div>}

              <div className="flex flex-wrap items-center justify-between gap-3">
                <p className="text-xs text-slate-500 max-w-xs">
                  The backend dedupes by fingerprint and streams the investigation via SSE as it happens.
                </p>
                <button
                  id="btn-submit-and-open"
                  onClick={onSubmit}
                  disabled={submitting}
                  className="rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 hover:from-cyan-400 hover:to-blue-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {submitting ? "Submitting…" : "Submit & Open Live Case →"}
                </button>
              </div>
            </div>

            {/* Right: pipeline stages */}
            <div className="space-y-6">
              <div className="rounded-2xl border border-slate-800/80 bg-gradient-to-br from-slate-900/90 to-slate-950/80 p-5">
                <div className="text-[10px] font-semibold uppercase tracking-[0.24em] text-cyan-400 mb-3">Pipeline stages</div>
                <div className="space-y-2">
                  {[
                    ["RECEIVED",   "Webhook accepted, case created in ClickHouse"],
                    ["NORMALIZED", "CVEs, IOCs and fingerprint extracted"],
                    ["DEDUP_CHECK","Fingerprint matched against existing cases"],
                    ["ENRICHING",  "MCP tool calls: NVD, EPSS, KEV, GitHub, ATT&CK"],
                    ["SCORING",    "Composite Priority Score computed (CPS formula)"],
                    ["COMPLETED",  "Executive summary written, case closed"],
                    ["DUPLICATE",  "Fingerprint matched — linked to canonical case"],
                    ["FAILED",     "Unhandled error → published to DLQ topic"],
                  ].map(([stage, desc]) => (
                    <div key={stage} className="flex items-start gap-3">
                      <Badge status={stage} />
                      <span className="text-xs text-slate-400 leading-5">{desc}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── App Router ────────────────────────────────────────────────────────────
    function parseRoute(pathname) {
      const alertMatch = pathname.match(/^\/alerts\/([0-9a-fA-F-]{36})$/);
      if (alertMatch) return { page: "detail", alertId: alertMatch[1] };
      if (pathname === "/submit") return { page: "submit" };
      return { page: "dashboard" };
    }

    function App() {
      const [path, setPath] = useState(window.location.pathname);

      const navigate = useCallback((to) => {
        window.history.pushState({}, "", to);
        setPath(to);
      }, []);

      useEffect(() => {
        const onPop = () => setPath(window.location.pathname);
        window.addEventListener("popstate", onPop);
        return () => window.removeEventListener("popstate", onPop);
      }, []);

      const route = useMemo(() => parseRoute(path), [path]);

      return (
        <>
          <AmbientBg />
          <NavBar path={path} navigate={navigate} />
          <main className="relative">
            {route.page === "dashboard" && <AlertsDashboard navigate={navigate} />}
            {route.page === "submit"    && <SubmitAlertPage navigate={navigate} />}
            {route.page === "detail"   && <AlertDetailPage alertId={route.alertId} navigate={navigate} />}
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
