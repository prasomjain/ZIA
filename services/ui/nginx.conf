server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all non-asset URLs serve index.html so React router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE proxy to FastAPI backend.
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # --- Critical for SSE (Server-Sent Events) ---
        # Disable nginx response buffering so agent_event frames reach the
        # browser immediately instead of being held until a buffer fills.
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;   # keep SSE connections alive for up to 1 h
        proxy_set_header       Connection "";
        chunked_transfer_encoding on;
    }
}
